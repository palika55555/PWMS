[build]
builder = "NIXPACKS"

[deploy]
startCommand = "if [ -f backend/package.json ]; then cd backend; elif [ -f package.json ]; then :; else echo 'ERROR: package.json not found. Set Railway Root Directory to backend.'; ls -la; exit 1; fi; npm run migrate && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10









