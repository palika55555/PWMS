[phases.setup]
# Node already includes npm; specifying npm-* can break on some nixpkgs pins.
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = [
  "if [ -f backend/package.json ]; then cd backend; elif [ -f package.json ]; then :; else echo 'ERROR: package.json not found. Set Railway Root Directory to backend.'; ls -la; exit 1; fi; npm install"
]

[phases.build]
cmds = [
  "if [ -f backend/package.json ]; then cd backend; elif [ -f package.json ]; then :; else echo 'ERROR: package.json not found. Set Railway Root Directory to backend.'; ls -la; exit 1; fi; npm run migrate || true"
]

[start]
cmd = "if [ -f backend/package.json ]; then cd backend; elif [ -f package.json ]; then :; else echo 'ERROR: package.json not found. Set Railway Root Directory to backend.'; ls -la; exit 1; fi; npm run migrate && npm start"


