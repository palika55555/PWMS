[phases.setup]
# Node already includes npm; specifying npm-* can break on some nixpkgs pins.
nixPkgs = ["nodejs-18_x"]

[phases.install]
cmds = ["if [ -d backend ]; then cd backend; fi; npm install"]

[phases.build]
cmds = ["if [ -d backend ]; then cd backend; fi; npm run migrate || true"]

[start]
cmd = "if [ -d backend ]; then cd backend; fi; npm run migrate && npm start"


